<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Richard  Iman | Docente Virtual</title>
  <style>
    :root {
      --primary: #6b21a8;
      --primary-hover: #581c87;
      --bg-main: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }

    .app-container { width: 100%; max-width: 600px; background: var(--card-bg); border-radius: var(--radius); border: 1px solid var(--border); text-align: center; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); overflow: hidden; }

    .hero-panel { position: relative; overflow: hidden; padding: 36px 20px 28px; background: radial-gradient(circle at 50% 40%, #1e1440 0%, #0f0a24 70%, #080614 100%); --voice-intensity: 0; }
    .hero-particles { position: absolute; inset: 0; pointer-events: none; }
    .hero-particle { position: absolute; bottom: 10px; border-radius: 50%; background: #c4b5fd; animation-name: floatUp; animation-timing-function: linear; animation-iteration-count: infinite; animation-duration: calc(var(--base-dur, 4s) - var(--voice-intensity, 0) * 1.5s); }
    @keyframes floatUp { 0% { transform: translateY(0) scale(1); opacity: 0; } 15% { opacity: 0.8; } 100% { transform: translateY(-140px) scale(0.4); opacity: 0; } }

    .avatar-container { position: relative; width: 130px; height: 130px; margin: 0 auto 16px auto; }
    /* La rotación del anillo la controla JS en tiempo real según el volumen
       de la voz; aquí solo definimos su apariencia, no la animación. */
    .avatar-ring { position: absolute; inset: -14px; border-radius: 50%; background: conic-gradient(from 0deg, #a78bfa, #6b21a8, #a78bfa); opacity: 0; transition: opacity 0.4s ease; }
    .avatar-ring-mask { position: absolute; inset: -4px; border-radius: 50%; background: #120c2a; }
    .pulse-ring { position: absolute; inset: -14px; border-radius: 50%; border: 2px solid rgba(167,139,250,0.5); opacity: 0; animation: pulseRing 1.8s ease-out infinite; animation-play-state: paused; }
    .pulse-ring.delay { animation-delay: 0.9s; }
    @keyframes pulseRing { 0% { transform: scale(1); opacity: 0.7; } 100% { transform: scale(1.35); opacity: 0; } }
    .avatar { position: relative; width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; border: 3px solid #2a2050; transition: all 0.3s ease; }

    /* Estado inactivo (antes de iniciar la llamada): sin anillo, sin pulso, sin partículas */
    .hero-panel.call-active .avatar-ring { opacity: 0.9; }
    .hero-panel.call-active .pulse-ring { animation-play-state: running; }
    .hero-panel.call-active .avatar { border-color: transparent; }


    h2 { font-size: 19px; color: #f5f3ff; margin-bottom: 4px; position: relative; }
    .role-title { font-size: 13px; color: #c4b5fd; font-weight: 600; margin-bottom: 0; position: relative; }

    .body-panel { padding: 24px 30px 40px; }

    .status-box { background: #f1f5f9; border-radius: 8px; padding: 12px 16px; font-size: 14px; color: var(--text-muted); margin-bottom: 30px; min-height: 48px; display: flex; align-items: center; justify-content: center; }

    .controls { display: flex; justify-content: center; gap: 16px; }
    .btn { padding: 14px 28px; border-radius: 30px; border: none; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; display: inline-flex; align-items: center; gap: 8px; }
    .btn-start { background: var(--primary); color: white; }
    .btn-start:hover { background: var(--primary-hover); }
    .btn-end { background: #ef4444; color: white; }
    .btn-end:hover { background: #dc2626; }
    .btn-restart { background: var(--text-muted); color: white; margin-top: 16px; }
    .btn-restart:hover { background: #475569; }

    /* Panel de evaluación */
    .eval-panel { display: none; text-align: left; margin-top: 10px; border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; }
    .eval-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 18px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
    .eval-header-title { font-size: 18px; font-weight: 700; color: var(--text-main); }
    .eval-header-subtitle { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .eval-header .score-block { text-align: right; white-space: nowrap; }
    .eval-header .score { font-size: 28px; font-weight: 800; color: var(--primary); }
    .eval-header .score-max { font-size: 14px; color: var(--text-muted); }

    .eval-criterio { margin-bottom: 16px; }
    .eval-criterio-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
    .eval-criterio-nombre { font-weight: 600; font-size: 14px; color: var(--text-main); }
    .eval-criterio-puntaje { font-weight: 700; color: var(--text-main); font-size: 13px; white-space: nowrap; }
    .eval-bar-track { background: #e2e8f0; border-radius: 6px; height: 8px; overflow: hidden; margin-bottom: 6px; }
    .eval-bar-fill { background: var(--primary); height: 100%; border-radius: 6px; }
    .eval-criterio-justif { font-size: 13px; color: var(--text-muted); line-height: 1.4; }

    .eval-section { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); }
    .eval-section-title { font-weight: 700; font-size: 14px; color: var(--text-main); margin-bottom: 6px; }
    .eval-section p { font-size: 13px; color: var(--text-main); line-height: 1.5; }
    .eval-section ul { margin: 6px 0 0 18px; padding: 0; }
    .eval-section li { font-size: 13px; color: var(--text-main); line-height: 1.6; }

    .eval-loading { text-align: center; padding: 28px 24px; background: #f5f0fc; border-radius: var(--radius); }
    .eval-loading-ring { width: 48px; height: 48px; margin: 0 auto 14px; border-radius: 50%; border: 4px solid #e4d4f4; border-top-color: var(--primary); animation: evalRingSpin 1s linear infinite; }
    @keyframes evalRingSpin { to { transform: rotate(360deg); } }
    .eval-loading-title { font-weight: 700; color: var(--primary); font-size: 15px; margin-bottom: 16px; }
    .eval-checklist { list-style: none; text-align: left; max-width: 280px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
    .eval-checklist li { display: flex; align-items: center; gap: 10px; font-size: 14px; color: #9ca3af; transition: color 0.3s ease; }
    .eval-checklist li .check-icon { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #d1d5db; flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: all 0.3s ease; }
    .eval-checklist li.active { color: var(--primary); }
    .eval-checklist li.active .check-icon { border: 2px solid #e4d4f4; border-top-color: var(--primary); animation: evalRingSpin 0.8s linear infinite; }
    .eval-checklist li.done { color: #16a34a; font-weight: 500; }
    .eval-checklist li.done .check-icon { background: #16a34a; border-color: #16a34a; animation: none; }
    .eval-checklist li.done .check-icon::after { content: "✓"; color: white; font-size: 12px; font-weight: 700; }
  </style>
</head>
<body>

<div class="app-container">
  <div class="hero-panel">
    <div class="hero-particles" id="heroParticles"></div>

    <div class="avatar-container" id="avatarContainer">
      <div class="avatar-ring"></div>
      <div class="avatar-ring-mask"></div>
      <img id="valeriaAvatar" src="https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?w=200" class="avatar" alt="Valeria">
      <span class="pulse-ring"></span>
      <span class="pulse-ring delay"></span>
    </div>

    <h2>Valeria</h2>
    <p class="role-title">Gerente de Operaciones de Tecnologías</p>
  </div>

  <div class="body-panel">
    <div id="callStatus" class="status-box">
      Presiona "Iniciar Llamada" para comenzar la simulación por voz.
    </div>

    <div class="controls">
      <button id="btnStart" class="btn btn-start" onclick="startCall()">🎙️ Iniciar Llamada</button>
      <button id="btnEnd" class="btn btn-end" onclick="endCall()" style="display:none;">🔴 Finalizar Llamada</button>
    </div>

    <div id="evalLoading" class="eval-loading" style="display:none;">
      <div class="eval-loading-ring"></div>
      <div class="eval-loading-title">Auditando respuestas...</div>
      <ul class="eval-checklist" id="evalChecklist"></ul>
    </div>

    <div id="evalPanel" class="eval-panel">
      <div class="eval-header">
        <div>
          <div class="eval-header-title">Evaluación de Desempeño</div>
          <div class="eval-header-subtitle">Escala Vigesimal (PMBOK / TI)</div>
        </div>
        <div class="score-block">
          <span id="evalNota" class="score">--</span><span class="score-max"> / 20</span>
        </div>
      </div>
      <div id="evalCriterios"></div>
      <div id="evalExtras"></div>
      <button class="btn btn-start btn-restart" style="width:100%;" onclick="location.reload()">🔄 Nueva llamada</button>
    </div>
  </div>
</div>

<script>
  const WS_URL = "wss://servidor-roleplay.onrender.com";

  let ws;
  let audioCtx;
  let outputAudioCtx;
  let mediaStream;
  let workletNode;
  let nextPlayTime = 0; // reloj de reproducción: cuándo debe sonar el próximo fragmento
  let evalTimeoutId = null; // ID del temporizador de respaldo al finalizar la llamada
  let outputAnalyser = null;
  let voiceLoopId = null;
  let ringAngle = 0;

  // Partículas flotantes decorativas del panel oscuro (solo durante la llamada)
  function crearParticulas() {
    const box = document.getElementById('heroParticles');
    box.innerHTML = '';
    const posiciones = [15, 25, 35, 50, 65, 75, 85, 20, 60, 80];
    posiciones.forEach((left, i) => {
      const dot = document.createElement('div');
      const size = 2 + (i % 3);
      dot.className = 'hero-particle';
      dot.style.left = left + '%';
      dot.style.width = size + 'px';
      dot.style.height = size + 'px';
      dot.style.setProperty('--base-dur', (4 + (i % 3)) + 's');
      dot.style.animationDelay = (i * 0.5) + 's';
      box.appendChild(dot);
    });
  }
  function limpiarParticulas() {
    document.getElementById('heroParticles').innerHTML = '';
  }

  // Analiza en tiempo real el volumen del audio que reproduce Valeria y usa
  // esa intensidad para mover el anillo y las partículas: cuanto más fuerte
  // habla, más rápido giran. En silencio, quedan en un giro lento "de espera".
  function iniciarAnalisisVoz() {
    outputAnalyser = outputAudioCtx.createAnalyser();
    outputAnalyser.fftSize = 256;
    outputAnalyser.smoothingTimeConstant = 0.6;
    outputAnalyser.connect(outputAudioCtx.destination);

    const dataArray = new Uint8Array(outputAnalyser.frequencyBinCount);
    const ring = document.querySelector('.avatar-ring');
    const heroPanel = document.querySelector('.hero-panel');
    const avatarContainer = document.getElementById('avatarContainer');

    function loop() {
      outputAnalyser.getByteTimeDomainData(dataArray);
      let sumSq = 0;
      for (let i = 0; i < dataArray.length; i++) {
        const v = (dataArray[i] - 128) / 128;
        sumSq += v * v;
      }
      const rms = Math.sqrt(sumSq / dataArray.length);
      const intensity = Math.min(1, rms * 4); // 0 = silencio, 1 = voz fuerte

      // Velocidad de giro: lenta en silencio (~0.3°/frame), rápida al hablar fuerte
      ringAngle += 0.3 + intensity * 9;
      if (ring) ring.style.transform = `rotate(${ringAngle}deg)`;

      // Ligero "respiro" del avatar sincronizado con el volumen
      if (avatarContainer) avatarContainer.style.transform = `scale(${1 + intensity * 0.05})`;

      heroPanel.style.setProperty('--voice-intensity', intensity.toFixed(2));

      voiceLoopId = requestAnimationFrame(loop);
    }
    loop();
  }

  function detenerAnalisisVoz() {
    if (voiceLoopId) cancelAnimationFrame(voiceLoopId);
    voiceLoopId = null;
    ringAngle = 0;
    const heroPanel = document.querySelector('.hero-panel');
    if (heroPanel) heroPanel.style.setProperty('--voice-intensity', '0');
    const avatarContainer = document.getElementById('avatarContainer');
    if (avatarContainer) avatarContainer.style.transform = 'scale(1)';
    outputAnalyser = null;
  }

  async function startCall() {
    const status = document.getElementById('callStatus');
    status.innerText = "Conectando con el servidor...";
    nextPlayTime = 0;

    // IMPORTANTE para móviles (especialmente iOS Safari): los AudioContext
    // deben crearse y activarse dentro del gesto de toque del usuario (este
    // clic), antes de cualquier "await". Si se crean más tarde (p.ej. dentro
    // de una función async llamada después de esperar el WebSocket), el
    // navegador ya no lo reconoce como parte de la interacción del usuario
    // y bloquea el audio en silencio, sin mostrar ningún error.
    audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
    outputAudioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
    try {
      if (audioCtx.state === 'suspended') await audioCtx.resume();
      if (outputAudioCtx.state === 'suspended') await outputAudioCtx.resume();
    } catch (e) {
      console.error('No se pudo activar el audio:', e);
    }

    // A partir de aquí la llamada está "activa": mostramos el anillo/partículas
    // y arrancamos el análisis de voz que controla su velocidad.
    document.querySelector('.hero-panel').classList.add('call-active');
    crearParticulas();
    iniciarAnalisisVoz();

    try {
      ws = new WebSocket(WS_URL);

      ws.onopen = async () => {
        status.innerText = "🟢 Llamada activa. Habla por el micrófono...";
        document.getElementById('btnStart').style.display = 'none';
        document.getElementById('btnEnd').style.display = 'inline-flex';
        await initAudioCapture();
      };

      ws.onmessage = async (event) => {
        try {
          const data = JSON.parse(event.data);

          if (data.type === 'evaluation') {
            if (evalTimeoutId) { clearTimeout(evalTimeoutId); evalTimeoutId = null; }
            mostrarEvaluacion(data.data);
            return;
          }
          if (data.type === 'evaluation_error') {
            if (evalTimeoutId) { clearTimeout(evalTimeoutId); evalTimeoutId = null; }
            mostrarErrorEvaluacion(data.message);
            return;
          }

          if (data.serverContent && data.serverContent.modelTurn) {
            const parts = data.serverContent.modelTurn.parts;
            for (let part of parts) {
              if (part.inlineData && part.inlineData.mimeType.startsWith("audio/")) {
                playBase64Pcm(part.inlineData.data);
              }
            }
          }
        } catch(e) {
          console.error("No se pudo interpretar el mensaje del servidor:", e, event.data);
        }
      };

      ws.onerror = (err) => {
        console.error("Error WebSocket:", err);
        status.innerText = "❌ Error al conectar con el servidor.";
      };

      ws.onclose = (e) => {
        console.log("WebSocket cerrado. Código:", e.code, "Razón:", e.reason);
        if (evalTimeoutId) { clearTimeout(evalTimeoutId); evalTimeoutId = null; }
        // Si la llamada terminó por el flujo normal (el usuario presionó
        // "Finalizar Llamada"), la evaluación ya se maneja en endCall()/
        // mostrarEvaluacion() y no hay que hacer nada más aquí.
        // Esto solo cubre un cierre inesperado (p.ej. se cayó la conexión)
        // mientras la llamada seguía activa.
        const evalVisible = document.getElementById('evalPanel').style.display === 'block';
        const stillInCall = document.getElementById('btnEnd').style.display !== 'none';
        if (!evalVisible && stillInCall) {
          document.getElementById('evalLoading').style.display = 'none';
          document.getElementById('callStatus').innerText = "Se perdió la conexión. Llamada finalizada.";
          document.getElementById('btnStart').style.display = 'inline-flex';
          document.getElementById('btnEnd').style.display = 'none';
          if (workletNode) workletNode.disconnect();
          if (mediaStream) mediaStream.getTracks().forEach(track => track.stop());
          if (outputAudioCtx && outputAudioCtx.state !== 'closed') outputAudioCtx.close();
          if (audioCtx && audioCtx.state !== 'closed') audioCtx.close();
        }
      };

    } catch (e) {
      console.error(e);
      status.innerText = "❌ Error al iniciar audio.";
    }
  }

  async function initAudioCapture() {
    // audioCtx y outputAudioCtx ya fueron creados y activados en startCall(),
    // dentro del gesto de clic del usuario (necesario para móviles/iOS).

    mediaStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
    const source = audioCtx.createMediaStreamSource(mediaStream);

    // AudioWorklet dinámico en línea para evitar dependencias de archivos externos
    const workletCode = `
      class RecorderProcessor extends AudioWorkletProcessor {
        process(inputs, outputs, parameters) {
          const input = inputs[0];
          if (input && input.length > 0) {
            const float32Data = input[0];
            this.port.postMessage(float32Data);
          }
          return true;
        }
      }
      registerProcessor('recorder-processor', RecorderProcessor);
    `;

    const blob = new Blob([workletCode], { type: 'application/javascript' });
    const workletUrl = URL.createObjectURL(blob);
    await audioCtx.audioWorklet.addModule(workletUrl);

    workletNode = new AudioWorkletNode(audioCtx, 'recorder-processor');
    
    // Agrupamos el audio antes de enviarlo. El AudioWorklet entrega bloques
    // diminutos (~8ms) constantemente; mandar un mensaje WebSocket por cada
    // uno genera mucha sobrecarga y se siente como demora. Acumulamos ~100ms
    // de audio (1600 muestras a 16kHz) antes de enviar cada mensaje.
    const BATCH_SIZE_SAMPLES = 1600;
    let audioBatch = [];
    let audioBatchLength = 0;

    workletNode.port.onmessage = (e) => {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      audioBatch.push(e.data);
      audioBatchLength += e.data.length;

      if (audioBatchLength >= BATCH_SIZE_SAMPLES) {
        const merged = new Float32Array(audioBatchLength);
        let offset = 0;
        for (const chunk of audioBatch) {
          merged.set(chunk, offset);
          offset += chunk.length;
        }
        audioBatch = [];
        audioBatchLength = 0;

        const pcm16 = convertFloat32ToPCM16(merged);
        const base64Audio = arrayBufferToBase64(pcm16.buffer);

        const payload = {
          realtimeInput: {
            audio: { mimeType: "audio/pcm;rate=16000", data: base64Audio }
          }
        };
        ws.send(JSON.stringify(payload));
      }
    };

    source.connect(workletNode);
    // NOTA: no conectamos workletNode a audioCtx.destination.
    // Hacerlo reproducía tu propio micrófono por los parlantes en tiempo real,
    // lo cual puede sumarse al ruido/eco que escuchabas. Un GainNode en 0
    // mantiene el grafo de audio "vivo" (necesario en algunos navegadores)
    // sin que se escuche nada.
    const silentSink = audioCtx.createGain();
    silentSink.gain.value = 0;
    workletNode.connect(silentSink);
    silentSink.connect(audioCtx.destination);
  }

  function playBase64Pcm(base64Data) {
    const avatarContainer = document.getElementById('avatarContainer');
    avatarContainer.classList.add('speaking');

    const binary = atob(base64Data);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    
    const int16Array = new Int16Array(bytes.buffer);
    const float32Array = new Float32Array(int16Array.length);
    for (let i = 0; i < int16Array.length; i++) float32Array[i] = int16Array[i] / 32768.0;

    const buffer = outputAudioCtx.createBuffer(1, float32Array.length, 24000);
    buffer.getChannelData(0).set(float32Array);

    const source = outputAudioCtx.createBufferSource();
    source.buffer = buffer;
    // Si el analizador de voz está listo, lo enrutamos por ahí (él ya está
    // conectado a outputAudioCtx.destination); si no, vamos directo al destino.
    source.connect(outputAnalyser || outputAudioCtx.destination);

    // Encolar el fragmento para que empiece justo cuando termine el anterior,
    // en vez de que todos arranquen al mismo tiempo (eso era el "ruido de radio").
    const now = outputAudioCtx.currentTime;
    if (nextPlayTime < now) nextPlayTime = now;
    source.start(nextPlayTime);
    nextPlayTime += buffer.duration;

    // Quitar el efecto visual "hablando" cuando termine de sonar este fragmento
    source.onended = () => {
      if (outputAudioCtx.currentTime >= nextPlayTime - 0.05) {
        avatarContainer.classList.remove('speaking');
      }
    };
  }

  function convertFloat32ToPCM16(buffer) {
    let l = buffer.length;
    let buf = new Int16Array(l);
    while (l--) buf[l] = Math.max(-1, Math.min(1, buffer[l])) * 0x7FFF;
    return buf;
  }

  function arrayBufferToBase64(buffer) {
    let binary = '';
    let bytes = new Uint8Array(buffer);
    for (let i = 0; i < bytes.byteLength; i++) binary += String.fromCharCode(bytes[i]);
    return window.btoa(binary);
  }

  // Lista de los 5 criterios (debe coincidir con la rúbrica del servidor,
  // solo para fines visuales mientras se espera la evaluación real).
  const CRITERIOS_NOMBRES = [
    "Seguridad y Liderazgo",
    "Coherencia y Viabilidad",
    "Precisión Técnica (PMBOK / TI)",
    "Estructura y Planificación",
    "Gestión de Stakeholders"
  ];
  // Momentos (ms) en que se marcan los criterios 0-3 como completados mientras
  // se espera; el 5to se queda "en progreso" (spinner) hasta la respuesta real.
  const CHECK_TIMINGS_MS = [1200, 2800, 4500, 6500];
  let checklistTimeouts = [];

  function iniciarChecklistAnimada() {
    const ul = document.getElementById('evalChecklist');
    ul.innerHTML = CRITERIOS_NOMBRES.map((nombre, i) =>
      `<li id="chk-${i}"><span class="check-icon"></span>${i + 1}. ${nombre}</li>`
    ).join('');
    document.getElementById('chk-0')?.classList.add('active');

    checklistTimeouts = CHECK_TIMINGS_MS.map((ms, i) => setTimeout(() => {
      document.getElementById(`chk-${i}`)?.classList.remove('active');
      document.getElementById(`chk-${i}`)?.classList.add('done');
      document.getElementById(`chk-${i + 1}`)?.classList.add('active');
    }, ms));
  }

  // Al llegar la respuesta real (éxito o error), completa de golpe cualquier
  // criterio que aún estuviera pendiente (con un pequeño efecto en cascada)
  // y luego ejecuta la función que muestra el resultado final.
  function completarChecklistYMostrar(mostrarResultadoFn) {
    checklistTimeouts.forEach(t => clearTimeout(t));
    checklistTimeouts = [];

    let delay = 0;
    for (let i = 0; i < CRITERIOS_NOMBRES.length; i++) {
      const el = document.getElementById(`chk-${i}`);
      if (el && !el.classList.contains('done')) {
        setTimeout(() => { el.classList.remove('active'); el.classList.add('done'); }, delay);
        delay += 150;
      }
    }
    setTimeout(mostrarResultadoFn, delay + 300);
  }

  function endCall() {
    // Detenemos la captura de audio y el micrófono de inmediato...
    if (workletNode) workletNode.disconnect();
    if (mediaStream) mediaStream.getTracks().forEach(track => track.stop());
    detenerAnalisisVoz();
    if (outputAudioCtx && outputAudioCtx.state !== 'closed') outputAudioCtx.close();
    if (audioCtx && audioCtx.state !== 'closed') audioCtx.close();
    nextPlayTime = 0;

    document.querySelector('.hero-panel').classList.remove('call-active');
    limpiarParticulas();
    document.getElementById('btnEnd').style.display = 'none';
    document.getElementById('avatarContainer').classList.remove('speaking');

    // ...pero NO cerramos el WebSocket todavía: le pedimos al servidor que
    // genere la evaluación con la transcripción acumulada, y esperamos su
    // respuesta antes de cerrar la conexión de verdad.
    if (ws && ws.readyState === WebSocket.OPEN) {
      document.getElementById('callStatus').innerText = "Llamada finalizada. Generando evaluación...";
      document.getElementById('evalLoading').style.display = 'block';
      iniciarChecklistAnimada();
      ws.send(JSON.stringify({ type: 'end_call_request' }));

      // Si el servidor no responde en 30s (p.ej. cayó la conexión), no dejamos
      // al usuario esperando para siempre. Guardamos el ID para poder
      // cancelarlo en cuanto llegue una respuesta real del servidor.
      evalTimeoutId = setTimeout(() => {
        if (ws && ws.readyState === WebSocket.OPEN) {
          mostrarErrorEvaluacion('El servidor tardó demasiado en responder.');
          ws.close();
        }
      }, 30000);
    } else {
      document.getElementById('callStatus').innerText = "Llamada finalizada.";
      document.getElementById('btnStart').style.display = 'inline-flex';
    }
  }

  function mostrarEvaluacion(evaluacion) {
    completarChecklistYMostrar(() => {
      document.getElementById('evalLoading').style.display = 'none';
      document.getElementById('callStatus').innerText = "Llamada finalizada. Esta es tu evaluación:";

      document.getElementById('evalNota').innerText = evaluacion.notaFinal;

      const cont = document.getElementById('evalCriterios');
      cont.innerHTML = '';
      evaluacion.criterios.forEach((c, i) => {
        const pct = Math.round((c.puntaje / 10) * 100);
        const div = document.createElement('div');
        div.className = 'eval-criterio';
        div.innerHTML = `
          <div class="eval-criterio-header">
            <span class="eval-criterio-nombre">${i + 1}. ${escapeHtml(c.nombre)}</span>
            <span class="eval-criterio-puntaje">${c.puntaje.toFixed(1)} / 10</span>
          </div>
          <div class="eval-bar-track"><div class="eval-bar-fill" style="width:${pct}%;"></div></div>
          <div class="eval-criterio-justif">${escapeHtml(c.justificacion || '')}</div>
        `;
        cont.appendChild(div);
      });

      const extras = document.getElementById('evalExtras');
      extras.innerHTML = '';

      if (evaluacion.diagnostico_general) {
        extras.innerHTML += `
          <div class="eval-section">
            <div class="eval-section-title">Diagnóstico General</div>
            <p>${escapeHtml(evaluacion.diagnostico_general)}</p>
          </div>
        `;
      }

      if (Array.isArray(evaluacion.recomendaciones_clave) && evaluacion.recomendaciones_clave.length) {
        const items = evaluacion.recomendaciones_clave.map(r => `<li>${escapeHtml(r)}</li>`).join('');
        extras.innerHTML += `
          <div class="eval-section">
            <div class="eval-section-title">Recomendaciones Clave</div>
            <ul>${items}</ul>
          </div>
        `;
      }

      document.getElementById('evalPanel').style.display = 'block';
    });
  }

  function mostrarErrorEvaluacion(mensaje) {
    completarChecklistYMostrar(() => {
      document.getElementById('evalLoading').style.display = 'none';
      document.getElementById('callStatus').innerText = "Llamada finalizada.";
      document.getElementById('evalNota').innerText = '--';
      document.getElementById('evalCriterios').innerHTML =
        `<div class="eval-criterio" style="color:#ef4444;">⚠️ No se pudo generar la evaluación: ${escapeHtml(mensaje)}</div>`;
      document.getElementById('evalExtras').innerHTML = '';
      document.getElementById('evalPanel').style.display = 'block';
    });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.innerText = str;
    return div.innerHTML;
  }
</script>

</body>
</html>
