<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Richard  Iman | Docente Virtual</title>
  <style>
    :root {
      --primary: #6b21a8;
      --primary-hover: #581c87;
      --bg-main: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }

    .app-container { width: 100%; max-width: 600px; background: var(--card-bg); border-radius: var(--radius); border: 1px solid var(--border); padding: 40px 30px; text-align: center; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); }

    .avatar-container { position: relative; width: 140px; height: 140px; margin: 0 auto 20px auto; }
    .avatar { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 4px solid var(--border); transition: all 0.3s ease; }
    .avatar.speaking { border-color: #22c55e; box-shadow: 0 0 30px rgba(34, 197, 94, 0.6); transform: scale(1.03); }

    h2 { font-size: 22px; color: var(--text-main); margin-bottom: 4px; }
    .role-title { font-size: 14px; color: var(--primary); font-weight: 600; margin-bottom: 16px; }
    
    .status-box { background: #f1f5f9; border-radius: 8px; padding: 12px 16px; font-size: 14px; color: var(--text-muted); margin-bottom: 30px; min-height: 48px; display: flex; align-items: center; justify-content: center; }

    .controls { display: flex; justify-content: center; gap: 16px; }
    .btn { padding: 14px 28px; border-radius: 30px; border: none; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; display: inline-flex; align-items: center; gap: 8px; }
    .btn-start { background: var(--primary); color: white; }
    .btn-start:hover { background: var(--primary-hover); }
    .btn-end { background: #ef4444; color: white; }
    .btn-end:hover { background: #dc2626; }
  </style>
</head>
<body>

<div class="app-container">
  <div class="avatar-container">
    <img id="valeriaAvatar" src="https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?w=200" class="avatar" alt="Valeria">
  </div>
  
  <h2>Valeria</h2>
  <p class="role-title">Gerente de Operaciones de Tecnoligías</p>

  <div id="callStatus" class="status-box">
    Presiona "Iniciar Llamada" para comenzar la simulación por voz.
  </div>

  <div class="controls">
    <button id="btnStart" class="btn btn-start" onclick="startCall()">🎙️ Iniciar Llamada</button>
    <button id="btnEnd" class="btn btn-end" onclick="endCall()" style="display:none;">🔴 Finalizar Llamada</button>
  </div>
</div>

<script>
  const WS_URL = "wss://servidor-roleplay.onrender.com";

  let ws;
  let audioCtx;
  let outputAudioCtx;
  let mediaStream;
  let workletNode;
  let nextPlayTime = 0; // reloj de reproducción: cuándo debe sonar el próximo fragmento

  async function startCall() {
    const status = document.getElementById('callStatus');
    status.innerText = "Conectando con el servidor...";
    nextPlayTime = 0;

    // IMPORTANTE para móviles (especialmente iOS Safari): los AudioContext
    // deben crearse y activarse dentro del gesto de toque del usuario (este
    // clic), antes de cualquier "await". Si se crean más tarde (p.ej. dentro
    // de una función async llamada después de esperar el WebSocket), el
    // navegador ya no lo reconoce como parte de la interacción del usuario
    // y bloquea el audio en silencio, sin mostrar ningún error.
    audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
    outputAudioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
    try {
      if (audioCtx.state === 'suspended') await audioCtx.resume();
      if (outputAudioCtx.state === 'suspended') await outputAudioCtx.resume();
    } catch (e) {
      console.error('No se pudo activar el audio:', e);
    }

    try {
      ws = new WebSocket(WS_URL);

      ws.onopen = async () => {
        status.innerText = "🟢 Llamada activa. Habla por el micrófono...";
        document.getElementById('btnStart').style.display = 'none';
        document.getElementById('btnEnd').style.display = 'inline-flex';
        await initAudioCapture();
      };

      ws.onmessage = async (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.serverContent && data.serverContent.modelTurn) {
            const parts = data.serverContent.modelTurn.parts;
            for (let part of parts) {
              if (part.inlineData && part.inlineData.mimeType.startsWith("audio/")) {
                playBase64Pcm(part.inlineData.data);
              }
            }
          }
        } catch(e) {
          console.error("No se pudo interpretar el mensaje del servidor:", e, event.data);
        }
      };

      ws.onerror = (err) => {
        console.error("Error WebSocket:", err);
        status.innerText = "❌ Error al conectar con el servidor.";
      };

      ws.onclose = (e) => {
        console.log("WebSocket cerrado. Código:", e.code, "Razón:", e.reason);
        endCall();
      };

    } catch (e) {
      console.error(e);
      status.innerText = "❌ Error al iniciar audio.";
    }
  }

  async function initAudioCapture() {
    // audioCtx y outputAudioCtx ya fueron creados y activados en startCall(),
    // dentro del gesto de clic del usuario (necesario para móviles/iOS).

    mediaStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
    const source = audioCtx.createMediaStreamSource(mediaStream);

    // AudioWorklet dinámico en línea para evitar dependencias de archivos externos
    const workletCode = `
      class RecorderProcessor extends AudioWorkletProcessor {
        process(inputs, outputs, parameters) {
          const input = inputs[0];
          if (input && input.length > 0) {
            const float32Data = input[0];
            this.port.postMessage(float32Data);
          }
          return true;
        }
      }
      registerProcessor('recorder-processor', RecorderProcessor);
    `;

    const blob = new Blob([workletCode], { type: 'application/javascript' });
    const workletUrl = URL.createObjectURL(blob);
    await audioCtx.audioWorklet.addModule(workletUrl);

    workletNode = new AudioWorkletNode(audioCtx, 'recorder-processor');
    
    // Agrupamos el audio antes de enviarlo. El AudioWorklet entrega bloques
    // diminutos (~8ms) constantemente; mandar un mensaje WebSocket por cada
    // uno genera mucha sobrecarga y se siente como demora. Acumulamos ~100ms
    // de audio (1600 muestras a 16kHz) antes de enviar cada mensaje.
    const BATCH_SIZE_SAMPLES = 800;
    let audioBatch = [];
    let audioBatchLength = 0;

    workletNode.port.onmessage = (e) => {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      audioBatch.push(e.data);
      audioBatchLength += e.data.length;

      if (audioBatchLength >= BATCH_SIZE_SAMPLES) {
        const merged = new Float32Array(audioBatchLength);
        let offset = 0;
        for (const chunk of audioBatch) {
          merged.set(chunk, offset);
          offset += chunk.length;
        }
        audioBatch = [];
        audioBatchLength = 0;

        const pcm16 = convertFloat32ToPCM16(merged);
        const base64Audio = arrayBufferToBase64(pcm16.buffer);

        const payload = {
          realtimeInput: {
            audio: { mimeType: "audio/pcm;rate=16000", data: base64Audio }
          }
        };
        ws.send(JSON.stringify(payload));
      }
    };

    source.connect(workletNode);
    // NOTA: no conectamos workletNode a audioCtx.destination.
    // Hacerlo reproducía tu propio micrófono por los parlantes en tiempo real,
    // lo cual puede sumarse al ruido/eco que escuchabas. Un GainNode en 0
    // mantiene el grafo de audio "vivo" (necesario en algunos navegadores)
    // sin que se escuche nada.
    const silentSink = audioCtx.createGain();
    silentSink.gain.value = 0;
    workletNode.connect(silentSink);
    silentSink.connect(audioCtx.destination);
  }

  function playBase64Pcm(base64Data) {
    const avatar = document.getElementById('valeriaAvatar');
    avatar.classList.add('speaking');

    const binary = atob(base64Data);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    
    const int16Array = new Int16Array(bytes.buffer);
    const float32Array = new Float32Array(int16Array.length);
    for (let i = 0; i < int16Array.length; i++) float32Array[i] = int16Array[i] / 32768.0;

    const buffer = outputAudioCtx.createBuffer(1, float32Array.length, 24000);
    buffer.getChannelData(0).set(float32Array);

    const source = outputAudioCtx.createBufferSource();
    source.buffer = buffer;
    source.connect(outputAudioCtx.destination);

    // Encolar el fragmento para que empiece justo cuando termine el anterior,
    // en vez de que todos arranquen al mismo tiempo (eso era el "ruido de radio").
    const now = outputAudioCtx.currentTime;
    if (nextPlayTime < now) nextPlayTime = now;
    source.start(nextPlayTime);
    nextPlayTime += buffer.duration;

    // Quitar el efecto visual "hablando" cuando termine de sonar este fragmento
    source.onended = () => {
      if (outputAudioCtx.currentTime >= nextPlayTime - 0.05) {
        avatar.classList.remove('speaking');
      }
    };
  }

  function convertFloat32ToPCM16(buffer) {
    let l = buffer.length;
    let buf = new Int16Array(l);
    while (l--) buf[l] = Math.max(-1, Math.min(1, buffer[l])) * 0x7FFF;
    return buf;
  }

  function arrayBufferToBase64(buffer) {
    let binary = '';
    let bytes = new Uint8Array(buffer);
    for (let i = 0; i < bytes.byteLength; i++) binary += String.fromCharCode(bytes[i]);
    return window.btoa(binary);
  }

  function endCall() {
    if (workletNode) workletNode.disconnect();
    if (mediaStream) mediaStream.getTracks().forEach(track => track.stop());
    if (ws && ws.readyState === WebSocket.OPEN) ws.close();
    if (outputAudioCtx && outputAudioCtx.state !== 'closed') outputAudioCtx.close();
    if (audioCtx && audioCtx.state !== 'closed') audioCtx.close();
    nextPlayTime = 0;

    document.getElementById('callStatus').innerText = "Llamada finalizada.";
    document.getElementById('btnStart').style.display = 'inline-flex';
    document.getElementById('btnEnd').style.display = 'none';
    document.getElementById('valeriaAvatar').classList.remove('speaking');
  }
</script>

</body>
</html>
